name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sayt fayllarini tayyorlash
        run: |
          dir=$(dirname "$(find . -name index.html -not -path './_site/*' | head -n1)")
          mkdir _site
          cp "$dir"/index.html "$dir"/sw.js "$dir"/manifest.json "$dir"/icon.svg "$dir"/icon-192.png "$dir"/icon-512.png _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
